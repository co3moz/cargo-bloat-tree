[package]
name = "cargo-bloat-tree"
version = "0.1.0"
edition = "2021"
description = "Attribute `cargo bloat --crates` output to the dependencies you actually declared"
license = "MIT"
readme = "README.md"
keywords = ["cargo", "bloat", "tree", "size", "dependencies"]
categories = ["development-tools::cargo-plugins"]

[[bin]]
name = "cargo-bloat-tree"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
