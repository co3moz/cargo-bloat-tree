[package]
name = "bloat-tree"
version = "0.1.1"
edition = "2021"
description = "Cargo dependency bloat mapper"
license = "MIT"
repository = "https://github.com/co3moz/cargo-bloat-tree"
readme = "README.md"
keywords = ["cargo", "bloat", "tree", "size", "dependencies"]
categories = ["development-tools::cargo-plugins"]

[[bin]]
name = "cargo-bloat-tree"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
